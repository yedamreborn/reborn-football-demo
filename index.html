<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Re:born Youth Football Hub</title>
<meta name="description" content="유소년 축구대회 일정, 실시간 스코어, 경기 기록">
<meta name="theme-color" content="#0b0c0b">
<link rel="stylesheet" href="brand.css">
<style>
  .hero { position: relative; border-bottom: 1px solid var(--line); overflow: hidden; }
  .hero-photo { position: absolute; inset: 0 0 0 38%; background: center/cover no-repeat; background-image: linear-gradient(135deg, #1b1e1a, #0b0c0b); }
  .hero-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--black) 0%, rgb(11 12 11 / .55) 35%, rgb(11 12 11 / .1) 100%), linear-gradient(0deg, var(--black) 0%, transparent 40%); }
  .hero .wrap { position: relative; padding-top: 72px; padding-bottom: 56px; }
  .hero .kicker { font-size: clamp(16px, 2vw, 20px); font-weight: 600; margin: 0 0 28px; color: var(--ivory); }
  .hero h1 { font-size: clamp(44px, 9.5vw, 112px); }
  .hero h1 mark { display: inline-block; margin-top: .06em; padding: .02em .14em .0; }
  .hero .lead { margin: 28px 0 0; max-width: 560px; color: var(--muted); font-size: 16px; }
  .hero .lead b { color: var(--ivory); }
  .tour { margin-top: 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-top: 18px; border-top: 1px solid var(--line); max-width: 640px; }
  .tour h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; flex: 1 1 100%; }
  .tour span { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 14px; }
  @media (max-width: 760px) {
    .hero-photo { inset: auto 0 0 0; height: 42%; }
    .hero-photo::after { background: linear-gradient(0deg, transparent 0%, var(--black) 100%); }
    .hero .wrap { padding-bottom: 260px; padding-top: 44px; }
  }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .stat { padding: 22px var(--pad); border-left: 1px solid var(--line); }
  .stat:first-child { border-left: 0; }
  .stat b { display: block; font-size: clamp(34px, 5vw, 60px); font-weight: 1000; letter-spacing: -0.04em; line-height: 1; }
  .stat.hot b { color: var(--turf); }
  .stat .mono { color: var(--muted); display: block; margin-top: 8px; }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } .stat:nth-child(3) { border-left: 0; } .stat:nth-child(n+3) { border-top: 1px solid var(--line); } }

  .cols { display: grid; gap: 40px; }
  @media (min-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } }
  .round { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--muted); margin-top: 8px; }
  .row { width: 100%; display: grid; grid-template-columns: 76px minmax(0, 1fr) 96px minmax(0, 1fr) 40px; align-items: center; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); text-align: left; transition: background .15s, padding .15s; }
  .row:hover { background: var(--soft); padding-left: 12px; padding-right: 12px; }
  .row:hover .ring { background: var(--turf); border-color: var(--turf); color: var(--turf-ink); }
  .when { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.5; text-transform: uppercase; }
  .when b { display: block; color: var(--ivory); font-size: 15px; font-weight: 700; }
  .side { display: flex; align-items: center; gap: 12px; min-width: 0; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  .side.home { justify-content: flex-end; text-align: right; }
  .side span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { text-align: center; font-size: 32px; font-weight: 1000; letter-spacing: -0.03em; line-height: 1; }
  .score .l { color: var(--dim); } .score.pre { font-size: 14px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
  @media (max-width: 640px) {
    .row { grid-template-columns: 52px minmax(0, 1fr) 70px minmax(0, 1fr); gap: 8px; }
    .row .ring { display: none; } .side { font-size: 15px; gap: 7px; } .score { font-size: 24px; } .crest { width: 24px; height: 24px; font-size: 11px; }
  }
  table { width: 100%; border-collapse: collapse; }
  th { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--dim); padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  td { padding: 14px 6px; text-align: center; border-bottom: 1px solid var(--line); font-size: 15px; }
  th:first-child, td:first-child { width: 34px; text-align: left; padding-left: 0; color: var(--dim); }
  td.t div { display: flex; align-items: center; gap: 10px; font-weight: 800; }
  td.p { font-weight: 1000; font-size: 18px; } tr.first td.p, tr.first td:first-child { color: var(--turf); }
  .note { margin: 14px 0 0; color: var(--dim); font-size: 12.5px; }

  /* 경기 상세 */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .66); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 50; background: var(--soft); border: 1px solid var(--line); overflow: auto; transition: transform .3s cubic-bezier(.16, 1, .3, 1); left: 0; right: 0; bottom: 0; max-height: 90dvh; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom); }
  .sheet.on { transform: none; }
  @media (min-width: 768px) { .sheet { left: auto; top: 0; bottom: 0; right: 0; width: 520px; max-height: none; transform: translateX(105%); } }
  @media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none; } }
  .sh-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 14px 24px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .mh { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; padding: 32px 24px 28px; text-align: center; align-items: start; border-bottom: 1px solid var(--line); }
  .mh .t { display: grid; justify-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
  .mh .big { font-size: 64px; font-weight: 1000; letter-spacing: -0.05em; line-height: 64px; }
  .mh .big.pre { font-size: 28px; color: var(--muted); }
  .scorers { font-size: 12.5px; font-weight: 500; color: var(--muted); line-height: 1.7; }
  .div { display: flex; align-items: center; gap: 12px; padding: 18px 24px 8px; color: var(--dim); }
  .div::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .ev { display: grid; grid-template-columns: 1fr 56px 1fr; align-items: center; padding: 9px 24px; }
  .ev .min { text-align: center; font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--muted); }
  .ev .l { text-align: right; } .ev .who { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; }
  .ev .l .who { flex-direction: row-reverse; } .ev small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
  .ev .ic { color: var(--turf); font-size: 18px; } .ev.cancel .who b { text-decoration: line-through; color: var(--dim); }
  .card { width: 11px; height: 15px; display: inline-block; } .card.y { background: #f2c230; } .card.r { background: #e5483d; }
  .acc { padding: 22px 24px 28px; }
</style>
</head>
<body>
<div class="util"><div class="wrap">
  <span class="mono">Re:born Corporation Lab / Youth Football Hub</span>
  <span class="chip on"><span class="dot"></span>조회 전용 데모</span>
</div></div>
<header class="nav"><div class="wrap">
  <a class="logo" href="#top" aria-label="Re:born">Re<i>:</i>born</a>
  <a class="l" href="#matches">경기</a><a class="l" href="#standings">순위</a>
  <a class="l opt" id="adminLink" href="admin.html" hidden>관리자</a>
  <a class="l opt sp" href="/docs" id="docsLink">API</a>
</div></header>

<section class="hero" id="top">
  <div class="hero-photo" id="heroImg"></div>
  <div class="wrap">
    <p class="kicker">현장의 모든 득점을 기록으로 남깁니다</p>
    <h1 class="display">EVERY GOAL,<br><mark>ON RECORD.</mark></h1>
    <p class="lead">경기 일정부터 실시간 스코어, <b>득점·경고·정정 기록</b>까지 한곳에서 확인하세요.</p>
    <div class="tour" id="tour"><h2 id="tname">불러오는 중</h2></div>
  </div>
</section>
<div class="stats" id="stats"></div>

<main class="wrap">
  <div class="cols">
    <section id="matches" aria-labelledby="mh">
      <div class="sec-h">
        <h2 class="display" id="mh">MATCHES</h2>
        <div class="seg" role="group" aria-label="경기 필터">
          <button data-f="all" aria-pressed="true">전체</button><button data-f="live" aria-pressed="false">진행 중</button><button data-f="done" aria-pressed="false">종료</button>
        </div>
      </div>
      <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    </section>
    <section id="standings" aria-labelledby="sh">
      <div class="sec-h"><h2 class="display" id="sh">TABLE</h2></div>
      <div id="table"></div>
      <p class="note">종료 및 결과 확정 경기 기준. 승 3점, 무 1점.</p>
    </section>
  </div>
</main>

<footer class="foot"><div class="wrap">
  <span>가상의 팀과 선수로 구성된 시연용 데이터입니다.</span>
  <span class="mono" id="updated"></span>
</div></footer>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="경기 상세"></aside>

<script src="data.js" onerror="void 0"></script>
<script src="common.js"></script>
<script>
let filter = "all", openId = null;
const empty = (ic, text) => h("div", { class: "empty" }, icon(ic), text);

function renderHero() {
  const t = S.t;
  $("#tname").textContent = t.name;
  $("#tour").replaceChildren(h("h2", { id: "tname" }, t.name),
    h("span", {}, icon("map-pin"), t.venue_text),
    h("span", {}, icon("calendar-blank"), `${t.start_date.replaceAll("-", ".")} ~ ${t.end_date.slice(5).replace("-", ".")}`),
    h("span", {}, icon("timer"), `전후반 각 ${t.half_minutes}분`));
  const goals = S.matches.reduce((n, m) => n + m.home_score + m.away_score, 0);
  const live = S.matches.filter((m) => m.status === "LIVE").length;
  $("#stats").replaceChildren(...[[Object.keys(S.teams).length, "Teams", ""], [S.matches.length, "Matches", ""], [live, "Live now", "hot"], [goals, "Goals", ""]]
    .map(([n, l, c]) => h("div", { class: "stat " + c }, h("b", { class: "num" }, String(n)), h("span", { class: "mono" }, l))));
}

function row(m) {
  const pre = m.status === "SCHEDULED";
  const hw = m.home_score > m.away_score, aw = m.away_score > m.home_score;
  const when = h("div", { class: "when" }, h("b", { class: "num" }, hm(m.scheduled_at)), `${m.field_no}구장`);
  const sc = pre ? h("div", { class: "score pre" }, "VS")
    : h("div", { class: "score num" }, h("span", { class: played(m) && aw ? "l" : "" }, String(m.home_score)), " : ", h("span", { class: played(m) && hw ? "l" : "" }, String(m.away_score)));
  const mid = h("div", { style: "display:grid;justify-items:center;gap:8px" }, sc, statusTag(m));
  const b = h("button", { class: "row", "aria-label": `${tname(m.home_team_id)} 대 ${tname(m.away_team_id)}, ${STATUS[m.status]}, 상세 보기` },
    when, h("div", { class: "side home" }, h("span", {}, tname(m.home_team_id)), crest(m.home_team_id)), mid,
    h("div", { class: "side" }, crest(m.away_team_id), h("span", {}, tname(m.away_team_id))), h("span", { class: "ring" }, icon("arrow-up-right")));
  b.addEventListener("click", () => openMatch(m.id));
  return b;
}

function renderList() {
  const ms = S.matches.filter((m) => filter === "all" || (filter === "live" ? m.status === "LIVE" : played(m)));
  if (!ms.length) return $("#list").replaceChildren(empty(filter === "live" ? "broadcast" : "flag-checkered", filter === "live" ? "지금 진행 중인 경기가 없습니다." : "종료된 경기가 없습니다."));
  const g = {}; ms.forEach((m) => (g[m.round_label + "|" + day(m.scheduled_at)] ??= []).push(m));
  $("#list").replaceChildren(...Object.entries(g).flatMap(([k, list]) => { const [r, d] = k.split("|");
    return [h("div", { class: "round mono" }, h("span", {}, r), h("span", {}, d)), ...list.map(row)]; }));
}

function renderTable() {
  const rows = standings();
  $("#table").replaceChildren(h("table", {}, h("thead", {}, h("tr", {}, ...["#", "Team", "P", "W", "D", "L", "GD", "Pts"].map((x, i) => h("th", i === 1 ? { style: "text-align:left" } : {}, x)))),
    h("tbody", {}, ...rows.map((r, i) => h("tr", { class: i === 0 ? "first" : "" }, h("td", { class: "num" }, String(i + 1)),
      h("td", { class: "t" }, h("div", {}, crest(r.id), tname(r.id))),
      ...[r.p, r.w, r.d, r.l].map((x) => h("td", { class: "num" }, String(x))), h("td", { class: "num" }, (r.gd > 0 ? "+" : "") + r.gd), h("td", { class: "p num" }, String(r.pts)))))));
}

const SUB = { PENALTY_GOAL: "페널티킥", OWN_GOAL: "자책골", YELLOW: "경고", RED: "퇴장", SUB: "교체" };
function evIcon(e) {
  if (GOALS.has(e.event_type)) return h("i", { class: "ph-fill ph-soccer-ball ic" });
  if (e.event_type === "YELLOW") return h("span", { class: "card y" });
  if (e.event_type === "RED") return h("span", { class: "card r" });
  return icon("arrows-left-right");
}
function openMatch(id, refresh) {
  const m = S.matches.find((x) => x.id === id); if (!m) return; openId = id;
  const evs = (S.events[id] || []).filter((e) => e.event_type !== "REVERSAL").sort((a, b) => a.period - b.period || a.minute - b.minute || a.recorded_at.localeCompare(b.recorded_at));
  let hs = 0, as = 0, lastP = 0; const scorers = { [m.home_team_id]: [], [m.away_team_id]: [] }; const lines = [];
  evs.forEach((e) => {
    if (e.period !== lastP) { lines.push(h("div", { class: "div mono" }, HALF[e.period])); lastP = e.period; }
    const goal = GOALS.has(e.event_type) && !e.reversed;
    if (goal) { e.scoring_team_id === m.home_team_id ? hs++ : as++; scorers[e.scoring_team_id].push(`${S.players[e.player_id] || ""} ${e.minute}'${e.event_type === "OWN_GOAL" ? " (자책)" : e.event_type === "PENALTY_GOAL" ? " (PK)" : ""}`); }
    const side = GOALS.has(e.event_type) ? e.scoring_team_id : e.team_id;
    const who = h("span", { class: "who" }, evIcon(e), h("span", {}, h("b", {}, S.players[e.player_id] || tname(e.team_id)),
      h("small", {}, e.reversed ? "기록 정정으로 취소됨" : [SUB[e.event_type] || "", goal ? `${SUB[e.event_type] ? "  " : ""}${hs} - ${as}` : ""])));
    const left = side === m.home_team_id;
    lines.push(h("div", { class: "ev" + (e.reversed ? " cancel" : "") }, h("div", { class: "l" }, left ? who : ""), h("div", { class: "min num" }, `${e.minute}'`), h("div", { class: "r" }, left ? "" : who)));
  });
  const pre = m.status === "SCHEDULED";
  const team = (tid) => h("div", { class: "t" }, crest(tid, true), tname(tid), h("div", { class: "scorers" }, ...scorers[tid].flatMap((s) => [s, h("br")])));
  const sheet = $("#sheet");
  sheet.replaceChildren(
    h("div", { class: "sh-top" }, h("span", { class: "mono" }, `${m.round_label} / ${day(m.scheduled_at)} ${hm(m.scheduled_at)} / ${m.field_no}구장`),
      h("button", { class: "ring", "aria-label": "닫기", id: "closeBtn" }, icon("x"))),
    h("div", { class: "mh" }, team(m.home_team_id), h("div", { style: "display:grid;gap:12px;justify-items:center" }, h("div", { class: "big num" + (pre ? " pre" : "") }, pre ? "VS" : `${m.home_score} : ${m.away_score}`), statusTag(m)), team(m.away_team_id)),
    h("div", { class: "acc" }, lines.length ? lines : empty(pre ? "clock" : "note-blank", pre ? `${hm(m.scheduled_at)} 경기 시작 예정입니다.` : "기록된 이벤트가 없습니다.")));
  $("#closeBtn").addEventListener("click", closeMatch);
  if (!refresh) { $("#scrim").classList.add("on"); sheet.classList.add("on"); $("#closeBtn").focus(); }
}
function closeMatch() { openId = null; $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#scrim").addEventListener("click", closeMatch);
document.addEventListener("keydown", (e) => e.key === "Escape" && closeMatch());
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b)); filter = b.dataset.f; renderList(); }));

async function boot() {
  if (!(await loadModel())) { $("#tname").textContent = "등록된 대회가 없습니다"; return $("#list").replaceChildren(empty("calendar-blank", "경기 일정이 아직 없습니다.")); }
  renderHero(); renderList(); renderTable(); if (openId) openMatch(openId, true);
  $("#updated").textContent = window.DATA ? "Snapshot" : "Updated " + new Date().toLocaleTimeString("ko-KR", TZ);
}
if (window.DATA) { $("#adminLink").hidden = false; $("#docsLink").remove(); }
const img = new Image(); img.onload = () => ($("#heroImg").style.backgroundImage = `url(${img.src})`); img.src = "img/hero.jpg";
boot().catch(() => { $("#tname").textContent = "데이터를 불러오지 못했습니다"; $("#list").replaceChildren(empty("wifi-slash", "잠시 후 다시 시도해 주세요.")); });
if (!window.DATA) setInterval(() => boot().catch(() => {}), 10000);
</script>
</body>
</html>
