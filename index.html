    --radius: 16px; --radius-sm: 10px;

  @media (prefers-color-scheme: dark) {

  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         font-size: 15px; line-height: 1.5; letter-spacing: -0.01em; }

  .num { font-variant-numeric: tabular-nums; }

  const g = (t) => p.find((x) => x.type === t).value; return `${g("month")}.${g("day")}(${g("weekday")})`; };
const hm = (iso) => new Date(iso).toLocaleTimeString("ko-KR", { ...TZ, hour: "2-digit", minute: "2-digit", hour12: false });
const PALETTE = ["#0b7a4b", "#1f5fbf", "#c2410c", "#6b3fa0", "#0e7490", "#b4235a", "#4d7c0f", "#334155"];
const HALF = { 1: "전반", 2: "후반", 3: "연장 전반", 4: "연장 후반" };
const GOALS = new Set(["GOAL", "PENALTY_GOAL", "OWN_GOAL"]);

let S = { t: null, teams: {}, players: {}, matches: [], events: {}, filter: "all", open: null };

const crest = (id, lg) => { const t = S.teams[id] || { name: "?", color: "#64748b" };
  return h("span", { class: "crest" + (lg ? " lg" : ""), style: `background:${t.color}`, "aria-hidden": "true" }, t.name.trim()[0]); };
const tname = (id) => (S.teams[id] || {}).name || "";
const status = (m) => m.status === "LIVE" ? "진행 중" : m.status === "APPROVED" ? "결과 확정" : m.status === "FINISHED" ? "종료" : m.status === "CANCELLED" ? "취소" : "예정";
const played = (m) => m.status === "FINISHED" || m.status === "APPROVED";

async function load() {
  const [ts, teams, players] = await Promise.all([api("/tournaments?page_size=1"), api("/teams?page_size=100"), api("/players?page_size=100")]);
  S.t = ts.items[0];
  if (!S.t) { $("#tname").textContent = "등록된 대회가 없습니다"; $("#list").replaceChildren(empty("ph-calendar-blank", "경기 일정이 아직 없습니다.")); return; }
  teams.items.forEach((t, i) => (S.teams[t.id] = { name: t.name, color: PALETTE[i % PALETTE.length] }));
  players.items.forEach((p) => (S.players[p.id] = p.name));
  S.matches = (await api(`/tournaments/${S.t.id}/matches?page_size=100`)).items
    .sort((a, b) => a.scheduled_at.localeCompare(b.scheduled_at) || a.field_no - b.field_no);
  const evs = await Promise.all(S.matches.map((m) => m.status === "SCHEDULED" ? { items: [] } : api(`/matches/${m.id}/events?page_size=100`)));
  S.matches.forEach((m, i) => (S.events[m.id] = evs[i].items));
  render();
  $("#updated").textContent = "시연용 스냅샷";
}

function render() {
  const t = S.t;
  $("#tname").textContent = t.name;
  $("#tmeta").replaceChildren(
    h("span", {}, h("i", { class: "ph ph-map-pin" }), t.venue_text),
    h("span", {}, h("i", { class: "ph ph-calendar-blank" }), `${t.start_date.replaceAll("-", ".")} ~ ${t.end_date.slice(5).replace("-", ".")}`),
    h("span", {}, h("i", { class: "ph ph-timer" }), `전후반 ${t.half_minutes}분`));
  const goals = S.matches.reduce((n, m) => n + m.home_score + m.away_score, 0);
  const live = S.matches.filter((m) => m.status === "LIVE").length;
  $("#facts").replaceChildren(...[[Object.keys(S.teams).length, "참가팀"], [S.matches.length, "경기"], [live, "진행 중"], [goals, "득점"]]
    .map(([n, l]) => h("div", { class: "fact" }, h("b", { class: "num" }, String(n)), h("small", {}, l))));
  renderList(); renderTable();
  if (S.open) openMatch(S.open, true);
}

function empty(icon, text) { return h("div", { class: "empty" }, h("i", { class: "ph " + icon }), text); }

function renderList() {
  const f = S.filter;
  const ms = S.matches.filter((m) => f === "all" || (f === "live" ? m.status === "LIVE" : played(m)));
  if (!ms.length) return $("#list").replaceChildren(empty(f === "live" ? "ph-broadcast" : "ph-flag-checkered", f === "live" ? "지금 진행 중인 경기가 없습니다." : "종료된 경기가 없습니다."));
  const groups = {};
  ms.forEach((m) => (groups[`${m.round_label} · ${day(m.scheduled_at)}`] ??= []).push(m));
  $("#list").replaceChildren(...Object.entries(groups).flatMap(([g, list]) => [h("div", { class: "round" }, g), ...list.map(row)]));
}

function row(m) {
  const live = m.status === "LIVE", pre = m.status === "SCHEDULED";
  const st = h("div", { class: "st" + (live ? " live" : "") },
    live ? [h("span", { class: "live-dot", "aria-hidden": "true" }), "LIVE"] : pre ? hm(m.scheduled_at) : played(m) ? "종료" : status(m),
    h("br"), h("span", { style: "font-weight:500;color:var(--ink-3)" }, `${m.field_no}구장`));
  const hw = m.home_score > m.away_score, aw = m.away_score > m.home_score;
  const sc = pre ? h("div", { class: "sc pre num" }, "vs")
    : h("div", { class: "sc num" }, h("span", { class: played(m) ? (hw ? "w" : aw ? "l" : "") : "" }, String(m.home_score)), " : ",
        h("span", { class: played(m) ? (aw ? "w" : hw ? "l" : "") : "" }, String(m.away_score)));
  const b = h("button", { class: "row", "aria-label": `${tname(m.home_team_id)} 대 ${tname(m.away_team_id)}, ${status(m)}, 상세 보기` },
    st, h("div", { class: "side home" }, h("span", {}, tname(m.home_team_id)), crest(m.home_team_id)),
    sc, h("div", { class: "side" }, crest(m.away_team_id), h("span", {}, tname(m.away_team_id))),
    h("i", { class: "ph ph-caret-right chev", "aria-hidden": "true" }));
  b.addEventListener("click", () => openMatch(m.id));
  return b;
}

function renderTable() {
  const tb = {};
  S.matches.forEach((m) => [m.home_team_id, m.away_team_id].forEach((id) => (tb[id] ??= { id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 })));
  S.matches.filter(played).forEach((m) => {
    const H = tb[m.home_team_id], A = tb[m.away_team_id];
    H.p++; A.p++; H.gf += m.home_score; H.ga += m.away_score; A.gf += m.away_score; A.ga += m.home_score;
    if (m.home_score > m.away_score) { H.w++; A.l++; } else if (m.home_score < m.away_score) { A.w++; H.l++; } else { H.d++; A.d++; }
  });
  const rows = Object.values(tb).map((r) => ({ ...r, gd: r.gf - r.ga, pts: r.w * 3 + r.d }))
    .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || tname(a.id).localeCompare(tname(b.id), "ko"));
  $("#table").replaceChildren(h("table", {},
    h("thead", {}, h("tr", {}, ...["#", "팀", "경기", "승", "무", "패", "득실", "승점"].map((x, i) => h("th", i === 1 ? { style: "text-align:left" } : {}, x)))),
    h("tbody", {}, ...rows.map((r, i) => h("tr", {},
      h("td", { class: "num" }, String(i + 1)),
      h("td", { class: "team" }, h("div", {}, crest(r.id), tname(r.id))),
      ...[r.p, r.w, r.d, r.l].map((x) => h("td", { class: "num" }, String(x))),
      h("td", { class: "num" }, (r.gd > 0 ? "+" : "") + r.gd),
      h("td", { class: "num" }, String(r.pts)))))));
}

function evIcon(e) {
  if (GOALS.has(e.event_type)) return h("i", { class: "ph-fill ph-soccer-ball ic-goal", "aria-hidden": "true" });
  if (e.event_type === "YELLOW") return h("span", { class: "card y", "aria-hidden": "true" });
  if (e.event_type === "RED") return h("span", { class: "card r", "aria-hidden": "true" });
  return h("i", { class: "ph ph-arrows-left-right", "aria-hidden": "true" });
}
const SUB = { PENALTY_GOAL: "페널티킥", OWN_GOAL: "자책골", YELLOW: "경고", RED: "퇴장", SUB: "교체" };

function openMatch(id, refresh) {
  const m = S.matches.find((x) => x.id === id); if (!m) return;
  S.open = id;
  const evs = (S.events[id] || []).filter((e) => e.event_type !== "REVERSAL")
    .sort((a, b) => a.period - b.period || a.minute - b.minute || a.recorded_at.localeCompare(b.recorded_at));
  let hs = 0, as = 0, lastP = 0;
  const scorers = { [m.home_team_id]: [], [m.away_team_id]: [] };
  const lines = [];
  evs.forEach((e) => {
    if (e.period !== lastP) { lines.push(h("div", { class: "divider" }, HALF[e.period])); lastP = e.period; }
    const goal = GOALS.has(e.event_type) && !e.reversed;
    if (goal) { e.scoring_team_id === m.home_team_id ? hs++ : as++; scorers[e.scoring_team_id].push(`${S.players[e.player_id] || ""} ${e.minute}'${e.event_type === "OWN_GOAL" ? "(자책)" : e.event_type === "PENALTY_GOAL" ? "(PK)" : ""}`); }
    const side = GOALS.has(e.event_type) ? e.scoring_team_id : e.team_id;
    const label = h("span", {}, h("b", {}, S.players[e.player_id] || tname(e.team_id)),
      h("small", {}, e.reversed ? "기록 정정으로 취소됨" : [SUB[e.event_type] || "", goal ? h("span", { class: "run num" }, `${SUB[e.event_type] ? "  " : ""}${hs} - ${as}`) : null]));
    const who = h("span", { class: "who" }, evIcon(e), label);
    const left = side === m.home_team_id;
    lines.push(h("div", { class: "ev" + (e.reversed ? " cancel" : "") },
      h("div", { class: "l" }, left ? who : ""), h("div", { class: "min num" }, `${e.minute}'`), h("div", { class: "r" }, left ? "" : who)));
  });
  const live = m.status === "LIVE", pre = m.status === "SCHEDULED";
  const team = (tid) => h("div", { class: "t" }, crest(tid, true), tname(tid), h("div", { class: "scorers" }, ...scorers[tid].flatMap((s) => [s, h("br")])));
  const sheet = $("#sheet");
  sheet.replaceChildren(
    h("div", { class: "grab" }),
    h("div", { class: "sh-top" }, h("span", { id: "sheetTitle" }, `${m.round_label} · ${day(m.scheduled_at)} ${hm(m.scheduled_at)} · ${m.field_no}구장`),
      h("button", { class: "close", "aria-label": "닫기", id: "closeBtn" }, h("i", { class: "ph ph-x" }))),
    h("div", { class: "mh" }, team(m.home_team_id),
      h("div", {}, h("div", { class: "big num" }, pre ? "vs" : `${m.home_score} : ${m.away_score}`),
        h("div", { class: "stt" + (live ? " live" : "") }, live ? [h("span", { class: "live-dot" }), "진행 중"] : status(m))),
      team(m.away_team_id)),
    h("div", { class: "tl" }, lines.length ? lines : empty(pre ? "ph-clock" : "ph-note-blank", pre ? `${hm(m.scheduled_at)} 경기 시작 예정입니다.` : "기록된 이벤트가 없습니다.")));
  $("#closeBtn").addEventListener("click", closeMatch);
  if (!refresh) { $("#scrim").classList.add("on"); sheet.classList.add("on"); $("#closeBtn").focus(); }
}
function closeMatch() { S.open = null; $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#scrim").addEventListener("click", closeMatch);
document.addEventListener("keydown", (e) => e.key === "Escape" && closeMatch());
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  S.filter = b.dataset.f; renderList();
}));

const img = new Image();
img.onload = () => ($("#heroImg").style.backgroundImage = `url(${img.src})`);
img.src = "img/hero.jpg";
img.onerror = () => { const p = new Image(); p.onload = () => ($("#heroImg").style.backgroundImage = `url(${p.src})`); p.src = "img/hero.png"; };

load().catch(() => { $("#tname").textContent = "데이터를 불러오지 못했습니다"; $("#list").replaceChildren(empty("ph-wifi-slash", "잠시 후 다시 시도해 주세요.")); });

</script>
</body>
</html>
